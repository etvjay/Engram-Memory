name: Frontend CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "tests/frontend/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "tests/frontend/**"
      - "package.json"
      - "tsconfig.json"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
